name: Auto Deploy to cPanel (jdih.arthawisesa.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy-app:
    name: Sync Laravel App to /repositories/jdih-kemenko-pangan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check FTP_PASSWORD secret is configured
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Secret FTP_PASSWORD belum diisi di GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Sync Laravel core files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: cartenz.iixcp.rumahweb.net
          username: artn3432
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./
          server-dir: /repositories/jdih-kemenko-pangan/
          state-name: .ftp-deploy-sync-state-app.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/.env*
            vendor/**
            node_modules/**
            storage/**
            public/**
            bootstrap/cache/*.php
            database/sql/**
            docs/**
            tests/**
            scratch/**

  deploy-public:
    name: Sync Public Web Assets to /public_html/jdih.arthawisesa.com
    needs: deploy-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync public assets & Vite build via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: cartenz.iixcp.rumahweb.net
          username: artn3432
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./public/
          server-dir: /public_html/jdih.arthawisesa.com/
          state-name: .ftp-deploy-sync-state-public.json
          dangerous-clean-slate: false
          exclude: |
            index.php
            .htaccess
            .well-known/**
            cgi-bin/**
            error_log
            storage
            storage/**
            assets/source/**
            assets/.gitignore
